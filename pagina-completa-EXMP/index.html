<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proyecto Frontend Educativo</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>


<!-- HEADER -->
<header class="header">
<div class="container"></div>
<nav class="nav">
<h1 class="logo">MiPortafolio</h1>
<button class="menu-btn" id="menuBtn">☰</button>
<ul class="nav-links" id="navLinks">
<li><a href="#hero">Inicio</a></li>
<li><a href="#projects">Proyectos</a></li>
<li><a href="#contact">Contacto</a></li>
</ul>
</nav>
</header>


<!-- HERO -->
<section class="hero" id="hero">
<div class="container"></div>
<h2>Aprendiendo Frontend desde Cero</h2>
<p>HTML, CSS y JavaScript en un solo proyecto</p>
<button class="btn" id="openModal">Ver más</button>
</section>


<!-- PROYECTOS -->
<section class="projects" id="projects">
<div class="container"></div>
<h2>Proyectos</h2>
<div class="cards" id="projectContainer"></div>
</section>


<!-- CONTACTO -->
<section class="contact" id="contact">
<div class="container"></div>
<h2>Contacto</h2>
<form id="contactForm">
<input type="text" id="name" placeholder="Nombre" required />
<input type="email" id="email" placeholder="Correo" required />
<textarea id="message" placeholder="Mensaje" required></textarea>
<button type="submit" class="btn">Enviar</button>
</form>
<p id="formStatus"></p>
</section>


<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" id="closeModal">&times;</span>
<h3>Proyecto Educativo</h3>
<p>Este proyecto sirve como base para aprender frontend moderno.</p>
</div>
</div>


<script src="script.js"></script>
</body>
</html>
